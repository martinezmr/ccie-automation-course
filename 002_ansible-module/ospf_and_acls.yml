- hosts: routers
  gather_facts: no
  connection: network_cli
  become: true
  tasks:
    - name: Configure OSPF
      arista.eos.eos_ospfv2:
        config:
          processes:
            - process_id: 1
              networks:
                - area: 0
                  mask: "0.0.255.255"
                  network_address: "192.168.1.1"

    - name: Configure ACLs
      arista.eos.eos_acls:
        config:
          - afi: ipv4
            acls:
              - name: FROM_WAN
                standard: false
                aces:
                  - grant: permit
                    source:
                      any: true
                    destination:
                      address: "192.168.1.0"
                      wildcard_bits: "0.0.0.255"